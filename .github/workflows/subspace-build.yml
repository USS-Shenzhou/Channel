name: Subspace Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'subspace/**'
      - '.github/workflows/subspace-build.yml'

env:
  VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-2022
            triplet: x64-windows
            msvc_arch: amd64
            bin: subspace.exe
          - platform: windows-aarch64
            runner: windows-2022
            triplet: arm64-windows
            msvc_arch: amd64_arm64
            bin: subspace.exe
          - platform: linux-x86_64
            runner: ubuntu-24.04
            triplet: x64-linux
            bin: subspace
          - platform: linux-aarch64
            runner: ubuntu-24.04
            triplet: arm64-linux
            cross_linux_aarch64: true
            bin: subspace
          - platform: macos-x86_64
            runner: macos-26
            triplet: x64-osx
            osx_arch: x86_64
            bin: subspace
          - platform: macos-aarch64
            runner: macos-26
            triplet: arm64-osx
            osx_arch: arm64
            bin: subspace

    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        working-directory: subspace

    steps:
      - uses: actions/checkout@v4

      # Expose ACTIONS_CACHE_URL / ACTIONS_RUNTIME_TOKEN to subsequent steps so
      # vcpkg's x-gha binary cache backend can authenticate against the runner's
      # cache service. Without this step, vcpkg silently falls back to rebuilding
      # every dependency from source on every run.
      - name: Export GitHub Actions cache env for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install CMake 4.2.x
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '~4.2.0'

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config

      - name: Setup aarch64-linux cross toolchain
        if: matrix.cross_linux_aarch64
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          mkdir -p "$RUNNER_TEMP/cmake"
          cat > "$RUNNER_TEMP/cmake/aarch64-linux-toolchain.cmake" <<'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)
          set(CMAKE_C_COMPILER aarch64-linux-gnu-gcc)
          set(CMAKE_CXX_COMPILER aarch64-linux-gnu-g++)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)
          EOF
          echo "VCPKG_CHAINLOAD_TOOLCHAIN_FILE=$RUNNER_TEMP/cmake/aarch64-linux-toolchain.cmake" >> "$GITHUB_ENV"

      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: |
          brew install ninja pkg-config || true

      - name: Select Xcode 26 (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.0.app/Contents/Developer
          echo "Selected: $(xcode-select -p)"
          echo "SDK path: $(xcrun --show-sdk-path)"

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Configure
        shell: bash
        run: |
          if [ -n "$VCPKG_INSTALLATION_ROOT" ]; then
            export VCPKG_ROOT="$VCPKG_INSTALLATION_ROOT"
          fi
          echo "Using VCPKG_ROOT=$VCPKG_ROOT"

          extra_args=()
          if [ -n "${{ matrix.osx_arch }}" ]; then
            extra_args+=("-DCMAKE_OSX_ARCHITECTURES=${{ matrix.osx_arch }}")
          fi
          if [ -n "$VCPKG_CHAINLOAD_TOOLCHAIN_FILE" ]; then
            extra_args+=("-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$VCPKG_CHAINLOAD_TOOLCHAIN_FILE")
          fi

          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            "${extra_args[@]}"

      - name: Build
        run: cmake --build build --config Release

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p _stage
          cp "build/${{ matrix.bin }}" "_stage/${{ matrix.bin }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: subspace-${{ matrix.platform }}
          path: subspace/_stage/${{ matrix.bin }}
          if-no-files-found: error

  docker:
    name: Docker build & push (Aliyun ACR)
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: subspace-linux-*
          path: _artifacts

      - name: Stage binaries for docker build
        run: |
          mkdir -p subspace/bin/amd64 subspace/bin/arm64
          cp _artifacts/subspace-linux-x86_64/subspace  subspace/bin/amd64/subspace
          cp _artifacts/subspace-linux-aarch64/subspace subspace/bin/arm64/subspace
          chmod +x subspace/bin/amd64/subspace subspace/bin/arm64/subspace

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        run: |
          docker login -u ${{ secrets.ACR_USERNAME }} -p ${{ secrets.ACR_PASSWORD }} ${{ secrets.ACR_REGISTRY }}

      - name: Compute image tags
        id: meta
        run: |
          IMAGE="${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ secrets.ACR_REPOSITORY }}"
          MOD_VERSION="$(grep -E '^mod_version=' gradle.properties | cut -d'=' -f2-)"
          if [ -z "$MOD_VERSION" ]; then
            echo "mod_version not found in gradle.properties" >&2
            exit 1
          fi
          SAFE_MOD_VERSION="$(echo "$MOD_VERSION" | tr '+' '_')"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          VERSION_TAG="${SAFE_MOD_VERSION}_${SHORT_SHA}"
          TAGS="${IMAGE}:${VERSION_TAG},${IMAGE}:latest"
          {
            echo "tags=${TAGS}"
            echo "primary=${VERSION_TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "Will push: ${TAGS}"

      - name: Build & push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: ./subspace
          file: ./subspace/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false

  release:
    name: Publish release
    needs: [build]
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v4

      # The release name is mod_version verbatim. If a release with that name
      # already exists (a commit that did not bump the version), this publish
      # is cancelled instead of overwriting the earlier one.
      - name: Resolve mod_version and check for an existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MOD_VERSION="$(grep -E '^mod_version=' gradle.properties | cut -d'=' -f2-)"
          if [ -z "$MOD_VERSION" ]; then
            echo "mod_version not found in gradle.properties" >&2
            exit 1
          fi
          echo "version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "$MOD_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $MOD_VERSION already exists - cancelling this publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Will publish release $MOD_VERSION"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The mod jar is produced by the `Neo Build` workflow, which runs on the
      # same push. Wait for its run on this exact commit instead of rebuilding.
      - name: Wait for the Neo Build run of this commit
        id: neobuild
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            info="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/neobuild.yml/runs?head_sha=$GITHUB_SHA&per_page=1" --jq '(.workflow_runs[0] // {}) | "\(.id // "none") \(.status // "none") \(.conclusion // "none")"')"
            run_id="$(echo "$info" | cut -d' ' -f1)"
            status="$(echo "$info" | cut -d' ' -f2)"
            conclusion="$(echo "$info" | cut -d' ' -f3)"
            echo "attempt $attempt: run=$run_id status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Neo Build run $run_id concluded '$conclusion' - no jar to publish." >&2
              exit 1
            fi
            sleep 30
          done
          echo "Timed out waiting for the Neo Build run of $GITHUB_SHA." >&2
          exit 1

      - name: Download the Neo Build jar
        if: steps.version.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: channel
          path: _jar
          run-id: ${{ steps.neobuild.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download subspace binaries
        if: steps.version.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: subspace-*
          path: _artifacts

      - name: Package per-platform zips
        if: steps.version.outputs.skip != 'true'
        run: |
          mkdir -p _release
          for platform in windows-x86_64 windows-aarch64 linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64; do
            src="_artifacts/subspace-$platform"
            if [ ! -d "$src" ]; then
              echo "Missing build artifact for $platform" >&2
              exit 1
            fi
            # upload-artifact drops the executable bit; restore it before zipping
            chmod +x "$src"/*
            zip -j "_release/subspace-$platform.zip" "$src"/*
          done
          cp _jar/*.jar _release/
          ls -lh _release

      - name: Create release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes _release/*
